name: Daily check-in

on:
  schedule:
    # 神秘小站每天凌晨 2 点开放名额，抢名额时段
    - cron: '0 18 * * *'
    - cron: '10 18 * * *'
    # 常规兜底（北京时间 06:20 / 09:10 / 13:30），签过会跳过
    - cron: '20 22 * * *'
    - cron: '10 1 * * *'
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略“今日已签到”，强制走一遍 Turnstile + 签到接口（调试用）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run password check-ins
        id: passwords
        continue-on-error: true
        env:
          CHECKIN_USERNAME: ${{ secrets.CHECKIN_USERNAME }}
          CHECKIN_PASSWORD: ${{ secrets.CHECKIN_PASSWORD }}
          SEEKAI_TOKEN: ${{ secrets.SEEKAI_TOKEN }}
          BENST_TOKEN: ${{ secrets.BENST_TOKEN }}
        run: node checkin-passwords.js

      - name: Run kk check-in (token + Turnstile)
        id: kk
        continue-on-error: true
        env:
          KK_TOKEN: ${{ secrets.KK_TOKEN }}
          KK_BASE_URL: https://kk.xjidjjdj.xyz
          KK_HEADLESS: '0'
          KK_CHANNEL: chrome
          KK_FORCE: ${{ inputs.force }}
        run: xvfb-run -a -s "-screen 0 1366x800x24" node checkin.js

      - name: Upload debug screenshot
        if: steps.kk.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: turnstile-timeout
          path: /tmp/turnstile-timeout.png
          if-no-files-found: ignore

      - name: Keep-alive commit
        if: always()
        run: |
          set -e
          mkdir -p history
          TODAY=$(TZ=Asia/Shanghai date +%F)
          if grep -q "^$TODAY " history/run.log 2>/dev/null; then
            echo "今天已有保活记录，跳过提交"
            exit 0
          fi
          echo "$TODAY $(TZ=Asia/Shanghai date '+%F %T %Z') check-in run" >> history/run.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/run.log
          git commit -m "chore: keep-alive $TODAY"
          git push origin HEAD:main

      - name: Fail if any check-in failed
        if: steps.passwords.outcome == 'failure' || steps.kk.outcome == 'failure'
        run: exit 1
