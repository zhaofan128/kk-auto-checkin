name: sync-secrets-to-host

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target repository'
        type: string
        default: 'zhaofan128/auto-checkin'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Copy kk secrets to host repo
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
          TARGET: ${{ inputs.target_repo }}
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.KK_TOKEN }}" | gh secret set KK_TOKEN --repo "$TARGET"
          printf '%s' "${{ secrets.CHECKIN_USERNAME }}" | gh secret set CHECKIN_USERNAME --repo "$TARGET"
          printf '%s' "${{ secrets.CHECKIN_PASSWORD }}" | gh secret set CHECKIN_PASSWORD --repo "$TARGET"
          printf '%s' "${{ secrets.SEEKAI_TOKEN }}" | gh secret set SEEKAI_TOKEN --repo "$TARGET"
          printf '%s' "${{ secrets.BENST_TOKEN }}" | gh secret set BENST_TOKEN --repo "$TARGET"
          echo "secret names synced"
